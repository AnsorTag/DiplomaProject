services:
  agents:
    build:
      context: .
    network_mode: host
    environment:
      DB_JDBC_URL: ${DB_JDBC_URL:-jdbc:postgresql://localhost:5432/tasks}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres@localhost:5432/tasks}
      STALE_TASK_MINUTES: ${STALE_TASK_MINUTES:-30}
      PYTHON_EXECUTABLE: /app/venv/bin/python
      PYTHON_TASK_RUNNER: /app/python_tasks/run_task.py
      RUN_TIMEOUT_SECONDS: ${RUN_TIMEOUT_SECONDS:-}
